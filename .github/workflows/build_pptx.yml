name: Build and publish front_half_draft_v1.pptx

on:
  push:
    branches:
      - main
    paths:
      - 'deliverables/**'
      - '.github/workflows/build_pptx.yml'
  workflow_dispatch: {}

jobs:
  build-pptx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r deliverables/requirements.txt

      - name: Convert SVGs and build PPTX
        run: |
          python deliverables/build_pptx.py

      - name: List deliverables
        run: ls -la deliverables || true

      - name: Commit generated PPTX and PNGs back to repo (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deliverables/front_half_draft_v1.pptx deliverables/charts/*.png || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: add generated PPTX and charts (CI)"
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi

      - name: Upload PPTX artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: front_half_draft_v1
          path: |
            deliverables/front_half_draft_v1.pptx
            deliverables/charts/*.png
